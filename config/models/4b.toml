# 8 GB game-streaming profile. Selected by the user at M0.5 instead of the
# 9B: on an RTX 3060 Ti the 9B cannot coexist with Geometry Dash + OBS +
# browser + desktop. M0.5 measurements were waived for this choice; this is
# provisional, not a measured bake-off winner. The 9B remains the quality
# target for non-game video if a clean-GPU comparison is ever run.
name = "4b"
model_id = "prithivMLmods/Qwen3.5-4B-Unredacted-MAX"
model = "data/models/Qwen3.5-4B-Unredacted-MAX.Q4_K_M.gguf"
mmproj = "data/models/Qwen3.5-4B-Unredacted-MAX.mmproj-Q8_0.gguf"
