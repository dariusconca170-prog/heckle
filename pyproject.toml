[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-sim"
version = "0.1.0"
description = "Local Twitch simulator: a video plays and an uncensored AI chat reacts to it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
# M0.5 full-load measurements need a real STT process. M8 will reuse the same
# Parakeet ONNX stack; pin it here so the gate and the feature cannot drift.
stt = [
  "onnx-asr[cpu,hub]==0.12.0",
]
# M8 microphone capture (VAD is built in; STT comes from the 'stt' extra).
mic = [
  "sounddevice>=0.5,<1",
]
# M9 screen capture. dxcam is Windows-only; mss is the portable fallback.
screen = [
  "mss>=9,<11",
]
screen-windows = [
  "dxcam>=0.0.5",
  "pygetwindow>=0.0.9",
]
# M9 pause hotkey (optional; the API/UI toggle works without it).
hotkey = [
  "keyboard>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
